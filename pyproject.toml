[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "am-datahub"
version = "0.1.0"
description = "Engineering data for additive manufacturing: powder lot genealogy, build parameters, machine logs, lab results and SPC on part density, behind a REST API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools]
packages = ["am_datahub"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:fastapi.*", "ignore::DeprecationWarning:starlette.*"]
